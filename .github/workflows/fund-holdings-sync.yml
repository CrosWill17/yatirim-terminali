name: fund-holdings-sync

on:
  schedule:
    - cron: '0 9 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fund-holdings-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: "Ön kontrol: gerekli secret'lar (eksikse hızlı ve net dur)"
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_OWNER_USER_ID: ${{ secrets.SUPABASE_OWNER_USER_ID }}
        run: |
          eksik=""
          if [ -z "$SUPABASE_URL" ]; then eksik="$eksik SUPABASE_URL"; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then eksik="$eksik SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -z "$SUPABASE_OWNER_USER_ID" ]; then eksik="$eksik SUPABASE_OWNER_USER_ID"; fi
          if [ -n "$eksik" ]; then
            echo "::error::Eksik GitHub secret'ları:$eksik"
            echo "Ekleyin: GitHub → Settings → Secrets and variables → Actions → New repository secret."
            echo "SUPABASE_OWNER_USER_ID değeri: Supabase → Authentication → Users → kendi hesabınızın UUID'si (SELECT id FROM auth.users)."
            exit 1
          fi
          if ! printf '%s' "$SUPABASE_OWNER_USER_ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::SUPABASE_OWNER_USER_ID UUID formatında değil (auth.users.id olmalı)."
            echo "Değer: Supabase → Authentication → Users → kendi hesabınızın UUID'si."
            exit 1
          fi
          echo "OK: gerekli secret'lar tanımlı."

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Kur (npm)
        run: npm ci

      - name: Fon içeriğini çek + parse + Supabase (yalnızca fund_holdings)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # service_role RLS'i atlar ve auth.uid() NULL'dır; fund_holdings.user_id
          # NOT NULL olduğu için job satırları KİMİN adına yazdığını bilmeli.
          # Değer: Supabase → Authentication → Users → kendi hesabınızın UUID'si.
          SUPABASE_OWNER_USER_ID: ${{ secrets.SUPABASE_OWNER_USER_ID }}
        run: npx -y tsx@4 scripts/fund_holdings/sync.ts

      - name: "Teşhis: DFI ham HTML arşiv (yalnızca tanı amaçlı, hiçbir tabloya yazmaz)"
        if: always()
        run: |
          curl -sL --max-time 30 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36' -H 'accept: text/html' 'https://fintables.com/fonlar/DFI' -o dfi-live.html || echo "curl hatası"
          echo "DFI boyut: $(wc -c < dfi-live.html 2>/dev/null || echo 0) bayt"
          echo "sirketler/ sayaci: $(grep -c 'sirketler/' dfi-live.html 2>/dev/null || true)"
          echo "IEYHO sayaci: $(grep -c 'IEYHO' dfi-live.html 2>/dev/null || true)"

      - name: "Arsiv: dfi-live-html"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dfi-live-html
          path: dfi-live.html
          if-no-files-found: ignore
